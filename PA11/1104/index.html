<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Badge and Button</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Badge and button</h1>

  <h2>Badges</h2>
  <span class="badge">New</span>
  <span class="badge badge-success">Passed</span>
  <span class="badge badge-warning">Pending</span>
  <span class="badge badge-danger" id="featured-badge">Failed</span>

  <h2>Buttons</h2>
  <button class="btn" id="save-btn" type="button">Save changes</button>
  <button class="btn btn-outline" type="button">Cancel</button>
  <button class="btn" type="button" disabled>Disabled</button>

</body>
</html>
